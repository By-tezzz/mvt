<!doctype html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVT GUI – {% block title %}Mobile Verification Toolkit{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col text-gray-100 font-sans">

  <!-- Top nav -->
  <header class="bg-gray-900 border-b border-gray-700 px-6 py-3 flex items-center gap-6 shrink-0">
    <a href="/" class="flex items-center gap-2 text-white font-bold text-lg tracking-tight">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      MVT
    </a>
    <nav class="flex gap-4 text-sm">
      <a href="/" class="text-gray-300 hover:text-white transition">Home</a>
      <a href="/ios" class="text-gray-300 hover:text-white transition">iOS</a>
      <a href="/android" class="text-gray-300 hover:text-white transition">Android</a>
    </nav>
  </header>

  <!-- Page content -->
  <main class="flex-1 overflow-auto">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-gray-900 border-t border-gray-700 text-center text-xs text-gray-500 py-2">
    Mobile Verification Toolkit &mdash; Amnesty International Security Lab &mdash;
    <a href="https://docs.mvt.re" target="_blank" class="underline hover:text-gray-300">docs.mvt.re</a>
  </footer>

</body>
</html>
